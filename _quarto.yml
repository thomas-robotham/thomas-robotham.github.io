project:
  type: website
  render:
    - "**/*.qmd"
    # stickers.qmd runs R (hexSticker/showtext) -- it is a local generation
    # tool, not a page, and excluding it keeps R out of the CI build.
    - "!stickers.qmd"
    # about.qmd still holds placeholder github.com/yourname links.
    - "!about.qmd"
  resources:
    - assets/models/**
    # Only the web-encoded clips; the source WAVs stay out of the site.
    - assets/audio/**/*.m4a
    - assets/js/**
    - assets/data/**
    # Posters and carousel images. The media carousel draws them in the
    # browser, so Quarto never sees them as <img> tags and would not copy them.
    - images/media/**
    - images/models/**
    # Self-hosted fonts (Lato, Academicons): nothing is loaded from a CDN.
    - assets/fonts/**

website:
  title: "T. M. Robotham"
  image: ./images/profile.jpg
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: highlights.qmd
        text: Highlights
      - href: cv.qmd
        text: CV
  # Footer on every page: copyright and the legal links centred, contact icons
  # on the right. Update the year when it turns over.
  page-footer:
    center:
      - text: "© 2026 Thomas M. Robotham. All rights reserved."
      - text: "Legal notice"
        href: impressum.qmd
      - text: "Privacy"
        href: privacy.qmd
    right:
      - icon: envelope
        href: mailto:thomas.robotham@audiolabs-erlangen.de
        aria-label: Email
      - icon: linkedin
        href: https://www.linkedin.com/in/thomasrobotham/
        aria-label: LinkedIn
      - text: '<i class="ai ai-google-scholar" role="img" aria-label="Google Scholar"></i>'
        href: https://scholar.google.de/citations?user=rEZgo9cAAAAJ&hl=en
      - text: '<i class="ai ai-orcid" role="img" aria-label="ORCID"></i>'
        href: https://orcid.org/0000-0002-2899-2916

format:
  html:
    theme:
      # The first entry is the default mode; dark leads so the site opens dark.
      dark: [superhero, theme-dark.scss]
      light: [superhero, theme-light.scss]
    # Fonts first, so styles.css can rely on them. All are served from this
    # site; see the privacy policy before adding anything from a CDN.
    css:
      - assets/fonts/lato/lato.css
      - assets/fonts/academicons/academicons.min.css
      - styles.css
    toc: true
    # Maths is converted to MathML when the site is built, which browsers draw
    # natively -- no MathJax script fetched from a CDN.
    html-math-method: mathml

  
